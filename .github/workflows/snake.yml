name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        if: false   # optional: only if you also want to publish via Pages
        with:
          target_branch: output
          build_dir: dist

      - name: push to output branch (used directly by README)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake game output"
          file_pattern: dist/*.svg
